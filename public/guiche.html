<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Guichê - DPE-PA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topbar">
        <div class="brand-container">
            <img src="images/dpepa.svg" alt="Logo DPE-PA" class="brand-logo">
            <div class="brand-title">
                Defensoria Pública
                <span>Estado do Pará</span>
            </div>
        </div>
        <nav class="topnav-links">
            <a href="totem.html" class="nav-link">Totem</a>
            <a href="guiche.html" class="nav-link active">Guichê</a>
            <a href="painel.html" class="nav-link">Painel</a>
        </nav>
        <div class="clock-container">
            <span id="clock-time" class="clock-badge">00:00:00</span>
            <span id="clock-date">00/00/0000</span>
        </div>
    </header>

    <main class="main-container-form">
        <div class="header-title">
            <span class="eyebrow">Área do Atendente</span>
            <h1>Controle de Atendimento dos Guichês</h1>
        </div>

        <section class="card">
            <div class="card-title">Fila de Espera em Tempo Real</div>
            <div class="queue-counts">
                <div class="count-card count-idoso">
                    <div class="count-label">Idoso (80+)</div>
                    <strong id="count-idoso">0</strong>
                </div>
                <div class="count-card count-prio">
                    <div class="count-label">Prioridade</div>
                    <strong id="count-prio">0</strong>
                </div>
                <div class="count-card count-normal">
                    <div class="count-label">Normal</div>
                    <strong id="count-normal">0</strong>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="card-title">
                <span>Chamar Atendimento</span>
            </div>

            <div class="service-selector">
                <div class="service-selector-label">Filtrar por Setor</div>
                <div class="service-options">
                    <button type="button" class="sector-btn active" data-sector="Vara Criminal">Vara Criminal</button>
                    <button type="button" class="sector-btn" data-sector="Família">Família</button>
                    <button type="button" class="sector-btn" data-sector="Execução Penal">Execução Penal</button>
                </div>
            </div>

            <div class="form-group">
                <div class="field-block">
                    <label for="select-guiche">Identificação do Guichê / Sala</label>
                    <select id="select-guiche">
                        <option value="1">Guichê 01</option>
                        <option value="2">Guichê 02</option>
                        <option value="3">Guichê 03</option>
                        <option value="4">Guichê 04</option>
                        <option value="5">Guichê 05</option>
                    </select>
                </div>
            </div>

            <button class="btn-call" onclick="chamarSelecionado()">CHAMAR PRÓXIMO</button>
            <div id="call-status" class="call-status" aria-live="polite"></div>

            <div class="last-called-box">
                <span class="lbl">Último chamado neste guichê</span>
                <div id="last-g1" class="val">--</div>
            </div>
        </section>

        <section class="card">
            <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
                <span>Histórico de Chamadas</span>
                <button class="btn-reset" onclick="confirmarZerar()">ZERAR FILAS</button>
            </div>

            <div class="history-list" id="history-list-guiche"></div>
        </section>
    </main>

    <!-- Script do Socket.IO (OBRIGATÓRIO vir antes do shared.js) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/shared.js"></script>

    <script src="js/guiche.js"></script>
</body>
</html>
